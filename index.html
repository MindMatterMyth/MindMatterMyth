<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Audio Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            
            /* --- BACKGROUND IMAGE CONFIGURATION --- */
            background-image: url('IMG_6580.png'); /* <-- REPLACE with your exact image filename (e.g., 'bg.png') */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .player-card {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 { margin-bottom: 5px; font-size: 24px; }
        p { color: #b3b3b3; margin-top: 0; margin-bottom: 25px; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>My Audio Track</h2>
        <p>Now Playing</p>
        
        <!-- --- AUDIO FILE PLAYER --- -->
        <audio controls>
            <source src="TEST.m4a" type="audio/mpeg"> <!-- <-- REPLACE with your exact audio filename (e.g., 'test.mp3') -->
            Your browser does not support the audio element.
        </audio>
    </div>

</body>
</html>
